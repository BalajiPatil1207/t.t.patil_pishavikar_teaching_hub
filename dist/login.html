<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - T.T.Patil Pishavikar</title>
    <style>
        /* Using Inter font for better readability, assumed to be available */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom alert box styling */
        .login-message {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            text-align: center;
        }
    </style>
    
  <link rel="stylesheet" crossorigin href="/assets/style-CAbG0zq-.css">
</head>
<body class="bg-gray-50">

    <header class="sticky top-0 z-50 bg-white shadow-md">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-orange-700">T.T.Patil Pishavikar</h1>
            <div class="space-x-4 md:space-x-8 text-lg font-medium hidden sm:flex">
                <a href="index.html" class="text-gray-600 hover:text-orange-600">Home</a>
                <a href="marathi.html" class="text-gray-600 hover:text-orange-600">Marathi</a>
                <a href="geography.html" class="text-gray-600 hover:text-orange-600">Geography</a>
                <a href="nmms.html" class="text-gray-600 hover:text-orange-600">NMMS</a>
                <a href="contact.html" class="text-gray-600 hover:text-orange-600">Contact</a>
                <a href="login.html" class="text-white bg-green-500 py-1 px-3 rounded-md hover:bg-green-600 transition">Login</a>
            </div>
            <button class="sm:hidden text-gray-600 hover:text-orange-600 text-2xl">☰</button>
        </nav>
    </header>

    <section class="py-20 flex justify-center items-center min-h-[70vh] px-4">
        <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border-t-4 border-green-500">
            <h2 class="text-4xl font-extrabold text-green-700 mb-4 text-center">Student Login 🧑‍🎓</h2>
            <p class="text-center text-gray-600 mb-8">Access your personalized learning dashboard.</p>

            <div id="messageBox" class="hidden login-message bg-blue-100 text-blue-700 border border-blue-300"></div>

            <form onsubmit="handleLoginAndStorage(event)" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Username or Email</label>
                    <input type="text" id="username" required 
                                class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 sm:text-sm">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required 
                                class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 sm:text-sm">
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" type="checkbox" 
                                class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                            Remember me
                        </label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-orange-600 hover:text-orange-500">
                            Forgot your password?
                        </a>
                    </div>
                </div>
                <div>
                    <button type="submit" 
                                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition">
                        Log In
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Don't have an account? 
                    <a href="#" class="font-medium text-orange-600 hover:text-orange-500">
                        Sign up now
                    </a>
                </p>
            </div>
        </div>
    </section>

    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p>&copy; 2025 T.T.Patil Pishavikar || All rights reserved.</p>
        </div>
    </footer>

    <script>
        const USERNAME_KEY = 'ttpatil_username';
        const REMEMBER_ME_KEY = 'ttpatil_remember';

        const usernameInput = document.getElementById('username');
        const rememberMeCheckbox = document.getElementById('remember-me');
        const messageBox = document.getElementById('messageBox');

        /**
         * Shows a message in the designated box.
         * @param {string} message The text message to display.
         * @param {string} type 'success', 'error', or 'info'.
         */
        function showMessage(message, type = 'info') {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-300', 'bg-green-100', 'text-green-700', 'border-green-300', 'bg-blue-100', 'text-blue-700', 'border-blue-300');
            
            if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-700', 'border-green-300');
            } else if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-700', 'border-red-300');
            } else { // info default
                messageBox.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-300');
            }

            // Hide the message after 5 seconds
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 5000);
        }

        /**
         * Loads the saved username and 'remember me' state from Local Storage when the page loads.
         */
        function loadStorageData() {
            try {
                const storedUsername = localStorage.getItem(USERNAME_KEY);
                const isRemembered = localStorage.getItem(REMEMBER_ME_KEY) === 'true';

                if (storedUsername) {
                    usernameInput.value = storedUsername;
                }
                
                // Set the checkbox state
                if (isRemembered) {
                    rememberMeCheckbox.checked = true;
                }

                if (storedUsername && isRemembered) {
                    showMessage('Username loaded automatically from Local Storage.', 'info');
                }

            } catch (e) {
                console.error("Local Storage Load Error:", e);
                // Inform the user discreetly if loading failed
                showMessage('An error occurred while loading Local Storage.', 'error');
            }
        }

        /**
         * Handles the login action and updates Local Storage based on the 'Remember me' checkbox.
         * @param {Event} event The form submission event.
         */
        function handleLoginAndStorage(event) {
            event.preventDefault(); // Prevents the form from submitting normally
            
            // Dummy Login Logic (Replace with actual API call in a real application)
            const username = usernameInput.value;
            const password = document.getElementById('password').value;
            
            // --- Local Storage Logic ---
            try {
                if (rememberMeCheckbox.checked) {
                    // 1. Checkbox is checked: Save the username and the state.
                    localStorage.setItem(USERNAME_KEY, username);
                    localStorage.setItem(REMEMBER_ME_KEY, 'true');
                    showMessage(`Login successful! Username "${username}" has been saved to Local Storage.`, 'success');

                } else {
                    // 2. Checkbox is NOT checked: Remove any previously stored data.
                    localStorage.removeItem(USERNAME_KEY);
                    localStorage.removeItem(REMEMBER_ME_KEY);
                    showMessage('Login successful! Local data was not saved.', 'success');
                }
            } catch (e) {
                console.error("Local Storage Save Error:", e);
                showMessage('Error storing or deleting local data.', 'error');
            }

            // In a real application, you would redirect the user here.
            // window.location.href = 'dashboard.html'; 

            // Clear password for security after 'submission'
            document.getElementById('password').value = '';
        }

        // Run the function when the page is fully loaded
        window.onload = loadStorageData;
    </script>
</body>
</html>
